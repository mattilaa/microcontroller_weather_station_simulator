name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pipeline:  lint ─┐
#                  ├─ build (host × toolchain × build type) ── test (same matrix)
#
# The build stage compiles and uploads the firmware; the test stage downloads
# that exact image and runs the Robot Framework suites under QEMU on the same
# host architecture. The two matrices must stay identical.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            tools/requirements.txt

      - name: Install tools
        # Pin clang-format so CI formats exactly like the developer machines.
        run: pip install -r tests/requirements.txt clang-format==21.1.8

      - name: Check C++ formatting
        run: |
          find src \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Validate Robot Framework suites (dry run)
        run: |
          python -m robot --dryrun --pythonpath tests/libraries \
            --output NONE --report NONE --log NONE tests

  build:
    name: Build ${{ matrix.host }} / ${{ matrix.toolchain }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        host: [x64, arm64]
        toolchain: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - host: x64
            runner: ubuntu-24.04
          - host: arm64
            runner: ubuntu-24.04-arm
          # On x64 the GNU compiler is a cross compiler; on arm64 it is the
          # native one. Both install binaries named aarch64-linux-gnu-*.
          - host: x64
            toolchain: gcc
            packages: g++-aarch64-linux-gnu
          - host: arm64
            toolchain: gcc
            packages: g++ binutils
          - toolchain: gcc
            cmake_args: >-
              -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-gcc-aarch64.cmake
              -DCROSS_PREFIX=aarch64-linux-gnu-
          - toolchain: clang
            packages: clang lld llvm
            cmake_args: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-clang-aarch64.cmake
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.packages }}

      - name: Show compiler
        run: |
          if [ "${{ matrix.toolchain }}" = gcc ]; then
            aarch64-linux-gnu-g++ --version
          else
            clang++ --version
          fi

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFIRMWARE_WERROR=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.host }}-${{ matrix.toolchain }}-${{ matrix.build_type }}
          path: |
            build/firmware.elf
            build/firmware.bin
            build/firmware.map
          if-no-files-found: error

  test:
    name: Test ${{ matrix.host }} / ${{ matrix.toolchain }} / ${{ matrix.build_type }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        host: [x64, arm64]
        toolchain: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - host: x64
            runner: ubuntu-24.04
          - host: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          qemu-system-aarch64 --version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            tools/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: firmware-${{ matrix.host }}-${{ matrix.toolchain }}-${{ matrix.build_type }}
          path: build

      - name: Run Robot Framework tests
        run: |
          python -m robot \
            --pythonpath tests/libraries \
            --variable FIRMWARE:build/firmware.elf \
            --outputdir results \
            --xunit xunit.xml \
            --consolecolors off \
            tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results-${{ matrix.host }}-${{ matrix.toolchain }}-${{ matrix.build_type }}
          path: results/
          if-no-files-found: ignore
